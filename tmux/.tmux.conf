# Rebind prefix from C-b to C-Space — closer to home row, doesn't collide
# with readline's C-b (cursor backward). Press C-Space twice to send a
# literal C-Space to the program inside tmux.
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Enable mouse mode (allows scrolling, pane selection, and resizing with mouse)
set -g mouse on

# Mouse model in copy-mode: Chrome-style. No auto-copy on mouse-up — the
# selection persists, copy-mode stays open, and the explicit `y` keystroke
# is what writes to the system clipboard and exits. `q`/`Escape` abandons
# without copying.
#
# MouseDragEnd: no-op (just select-pane for safety). Default tmux behavior
# would copy-and-cancel; we override to leave the selection visible and
# active so you can keep refining.
bind -T copy-mode-vi MouseDragEnd1Pane select-pane

# MouseDown: no-op (just select-pane). Default would clear the existing
# selection and start a fresh one at the click point. Suppressing only
# MouseDown — not MouseDrag — means subsequent click+drag still acts like
# a normal fresh selection (tmux's default MouseDrag re-anchors). Earlier
# experiment with overriding MouseDrag too produced unpredictable
# extension behavior; that path needs more thought.
bind -T copy-mode-vi MouseDown1Pane select-pane

# Double-click: enter copy-mode and seed selection with the clicked word.
# Triple-click: same with the whole line. Neither auto-copies.
bind -n DoubleClick1Pane select-pane \; copy-mode \; send -X select-word
bind -n TripleClick1Pane select-pane \; copy-mode \; send -X select-line

# `y` (vi-yank): copy current selection to the macOS clipboard and exit.
# This is the single explicit "I'm done, copy this" key under the new
# no-auto-copy model.
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Vim-style copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
# `y` binding lives below in the mouse-model block — it copy-pipes to pbcopy
# (system clipboard) rather than the internal tmux buffer.

# Faster escape (important for neovim)
set -sg escape-time 0

# Start window and pane numbering at 1 — matches the number row on the
# keyboard. `renumber-windows` keeps indices contiguous after a close
# (no gaps like 1,3,4).
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Increase scrollback
set -g history-limit 10000

# Window names are user-managed only. Two settings:
#  - allow-rename off:     programs (fish/zsh/ssh) can't push OSC title escapes
#                          that rewrite the name.
#  - automatic-rename off: tmux itself stops tracking pane_current_command
#                          and renaming the window after the fact.
# Net result: a fresh window keeps whatever initial name tmux gave it (usually
# the binary that launched in the pane — fish, etc.) until you `prefix + ,`
# and name it yourself. The running command still rides along in the slot
# label via @catppuccin_window_*_text below, so you don't lose visibility.
set -g allow-rename off
set -g automatic-rename off

# Default-name freshly-created windows after their cwd's basename, with a
# monotonically increasing suffix per same-basename: rybalt (1), rybalt (2),
# …  Manual `prefix + ,` still overrides at any time. The hook fires for
# every new-window (including the first window of a new-session), so we
# don't need a separate after-new-session hook. Script lives in the repo;
# referenced via the canonical ~/.config/rybalt symlink.
set-hook -g after-new-window 'run-shell -b "~/.config/rybalt/tmux/scripts/auto-name-window.sh #{window_id}"'

# Status bar styling — driven by catppuccin/tmux (config below).
# All status-style, window-status-*-style, pane-border-*-style, and
# message-style settings are provided by the plugin.

# Smart pane switching with vim-tmux-navigator (Ctrl+h/j/k/l)
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind -T copy-mode-vi 'C-h' select-pane -L
bind -T copy-mode-vi 'C-j' select-pane -D
bind -T copy-mode-vi 'C-k' select-pane -U
bind -T copy-mode-vi 'C-l' select-pane -R

# `prefix + r` — reload the tmux config in place.
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# ── Layouts & pane focus ─────────────────────────────────────────────────
# `prefix + e` — "editor layout": fresh window with editor on the left and
# a vertically-stacked pair on the right (top + bottom). Matches the layout
# I use most often.
bind e new-window \; \
       split-window -h -l 40% \; \
       split-window -v -l 50% \; \
       select-pane -L

# `prefix + E` — re-shape the CURRENT window's existing panes into the
# editor layout (one tall left "main" pane, others stacked on the right).
# Useful when a window has drifted off-layout. Pair with `prefix + {` /
# `prefix + }` to rotate which pane becomes the main column.
set -wg main-pane-width 60%
bind E select-layout main-vertical

# Resize the focused pane to dominate or shrink within its vertical split.
# In the editor layout's right column, press `prefix + >` while focused on
# top to make it 80% of window height; switch focus and press `>` again to
# flip the ratio. `prefix + |` restores the focused pane to 50% of window
# height (works for a 2-pane vertical split sharing the full height).
bind > resize-pane -y 80%
bind < resize-pane -y 20%
bind | resize-pane -y 50%

# ── "Modal" Claude popup ─────────────────────────────────────────────────
# `prefix + C` — summon a persistent claude-primary session in a floating popup.
# First invocation creates session "claude-primary" running the claude CLI; later
# invocations attach to the same session. Detach (prefix + d inside the
# popup) closes the popup and returns to your current pane while the
# claude-primary session keeps running. Same session is reachable from every
# tmux session on this machine.
bind C if-shell 'tmux has-session -t claude-primary 2>/dev/null' \
       'display-popup -E -w 85% -h 85% "tmux attach -t claude-primary"' \
       'display-popup -E -w 85% -h 85% "tmux new-session -s claude-primary claude"'

# `M-Escape` (alt + escape) — single-keystroke dismiss for the claude-primary popup.
# Gated on `#S = claude-primary` so the binding is a no-op outside the inner session
# (your main session keeps M-Escape free). Detaching the inner client exits
# `tmux attach`, which exits the popup's command, which closes the popup
# (display-popup -E above). The claude-primary tmux session itself stays alive, so
# next prefix+C re-attaches with state intact.
bind -n M-Escape if-shell '[ "#S" = "claude-primary" ]' 'detach-client'

# TPM — plugin manager
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-battery'

# tmux-battery does a one-shot text substitution of #{battery_*} placeholders
# in the listed options at plugin-load time. Default list is just
# "status-right status-left", but our status-right uses #{E:@catppuccin_*}
# expansions — the actual #{battery_*} placeholders live INSIDE catppuccin's
# battery module template. Add that option to the substitution list, and
# ensure tmux-battery loads AFTER catppuccin (handled by declaration order
# above) so the option exists at substitution time.
set -g @plugin_interpolated_options "status-right status-left @catppuccin_status_battery @catppuccin_battery_text"

# Catppuccin flavor (latte | frappe | macchiato | mocha). Tmux doesn't
# auto-switch with system theme, so picking a single flavor; mocha holds
# up reasonably well on either Latte or Mocha terminal background.
set -g @catppuccin_flavor 'mocha'

# Rounded separators between modules and window slots.
# Alternatives: slanted | basic | none | custom.
set -g @catppuccin_window_status_style 'rounded'

# Put the status line at the top — frees up the bottom row for shell
# prompts and keeps the date/session indicator at eye level alongside any
# editor status line.
set -g status-position top

# Window slot contents: index + current command (e.g. "2 | nvim").
set -g @catppuccin_window_default_text ' #W │ #{pane_current_command}'
set -g @catppuccin_window_current_text ' #W │ #{pane_current_command}'

# Desaturate the right-side module icons. Default catppuccin assigns each
# module a different accent color (peach/pink/teal/…); we'd rather keep the
# icons informational without competing for attention, so route every
# module's icon background to a neutral surface tone from the same palette.
set -g  @catppuccin_status_application_icon_bg "#{@thm_surface_2}"
set -g  @catppuccin_status_application_icon_fg "#{@thm_fg}"
set -g  @catppuccin_status_directory_icon_bg   "#{@thm_surface_2}"
set -g  @catppuccin_status_directory_icon_fg   "#{@thm_fg}"
set -g  @catppuccin_status_user_icon_bg        "#{@thm_surface_2}"
set -g  @catppuccin_status_user_icon_fg        "#{@thm_fg}"
set -g  @catppuccin_status_host_icon_bg        "#{@thm_surface_2}"
set -g  @catppuccin_status_host_icon_fg        "#{@thm_fg}"
set -g  @catppuccin_status_date_time_icon_bg   "#{@thm_surface_2}"
set -g  @catppuccin_status_date_time_icon_fg   "#{@thm_fg}"
set -g  @catppuccin_status_battery_icon_bg     "#{@thm_surface_2}"
set -g  @catppuccin_status_battery_icon_fg     "#{@thm_fg}"

# Catppuccin's battery module template defaults wrap #{battery_icon} and
# #{battery_percentage} in #{l:...} (literal, no further expansion). That
# clashes with tmux-battery, which substitutes those placeholders with
# `#(/path/script.sh)` shell refs that need to be executed — wrapped in
# #{l:...} they appear as literal text. Override both with plain refs.
set -g @catppuccin_battery_icon "#{battery_icon} "
set -g @catppuccin_battery_text " #{battery_percentage}"

# Status bar lengths and the session indicator on the left can be set up
# now — they don't reference catppuccin module options that need TPM to
# have run.
set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#{E:@catppuccin_status_session}"

# Initialize TPM — must run BEFORE composing status-right, since that
# composition uses -agF which expands at set time and needs every
# @catppuccin_status_* module option to already exist.
run '~/.tmux/plugins/tpm/tpm'

# Status bar contents — composed AFTER TPM (catppuccin's module options
# must already exist when these references are stored). Note: no `-F`
# flag here. With `-F` tmux pre-expands each `#{E:@catppuccin_status_*}`
# at config-load time, which deep-resolves the module template including
# pane-context formats (#{pane_current_command}, #(whoami), etc.) — those
# come back empty or frozen. Without `-F`, status-right stores the live
# format string and tmux re-expands it on every status-line render.
# `application` module dropped — the focused pane's running command now
# rides along inside each window-list slot via @catppuccin_window_*_text.
# `directory` only renders when the focused pane is NOT running a shell —
# i.e. when there's a chance you'd actually forget where you are because
# something else (claude-primary, tail, nvim, ssh) is holding the foreground.
# Matches any command ending in "sh": fish / bash / zsh / sh / ksh / dash.
set -g  status-right "#{?#{m:*sh,#{pane_current_command}},,#{E:@catppuccin_status_directory}}"
set -ag status-right "#{E:@catppuccin_status_user}"
set -ag status-right "#{E:@catppuccin_status_host}"
set -ag status-right "#{E:@catppuccin_status_battery}"
set -ag status-right "#{E:@catppuccin_status_date_time}"
