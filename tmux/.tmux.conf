# Enable mouse mode (allows scrolling, pane selection, and resizing with mouse)
set -g mouse on

# Mouse drag: copy to system clipboard and exit copy mode (like normal macOS selection)
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# Double-click selects word, triple-click selects line (copy to clipboard)
bind -n DoubleClick1Pane select-pane \; copy-mode \; send -X select-word \; run-shell -d 0.3 "" \; send -X copy-pipe-and-cancel "pbcopy"
bind -n TripleClick1Pane select-pane \; copy-mode \; send -X select-line \; run-shell -d 0.3 "" \; send -X copy-pipe-and-cancel "pbcopy"

# True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Vim-style copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Faster escape (important for neovim)
set -sg escape-time 0

# Increase scrollback
set -g history-limit 10000

# Status bar — minimal neutral
set -g status-style "bg=#2f3337,fg=#c9d1d9"
set -g status-left "[#S] "
set -g status-right " %H:%M %d-%b-%y "
set -g window-status-current-style "fg=#58a6ff,bold"
set -g window-status-style "fg=#8b949e"
set -g pane-border-style "fg=#444c56"
set -g pane-active-border-style "fg=#58a6ff"
set -g message-style "bg=#2f3337,fg=#c9d1d9"

# Smart pane switching with vim-tmux-navigator (Ctrl+h/j/k/l)
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind -T copy-mode-vi 'C-h' select-pane -L
bind -T copy-mode-vi 'C-j' select-pane -D
bind -T copy-mode-vi 'C-k' select-pane -U
bind -T copy-mode-vi 'C-l' select-pane -R

# TPM — plugin manager
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'

# Initialize TPM (keep at very bottom)
run '~/.tmux/plugins/tpm/tpm'
